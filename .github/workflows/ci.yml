name: CI

on:
  push:
  pull_request:

jobs:
  layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/check_layers.sh

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - run: cmake -S firmware/test/host -B build/host
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure

  firmware-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Build (mock sensor, log sink)
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-default set-target esp32
          idf.py -B build-default build
      - name: Build (mock sensor, BLE sink)
        run: |
          . $IDF_PATH/export.sh
          rm -f sdkconfig
          idf.py -B build-ble -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble" set-target esp32
          idf.py -B build-ble -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble" build
